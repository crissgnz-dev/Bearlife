<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bearlife</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <script src="/login/login.js"></script>
</head>
<body>
    <img src="../imagenes/fondo.gif" id="fondo" alt="">
    <div class="login" id="login-section">
        <h2>Iniciar Sesión</h2>
        <form onsubmit="login(event)" action="/api/login" method="POST">
            <div class="input">
                <label for="username">Usuario</label>
                <div>
                    <input type="text" id="username" name="username" required>
                    <div class="icon"><img src="/login/icon/login.png" alt=""></div>
                </div>
            </div>
            <div class="input">
                <label for="password">Contraseña</label>
                <div>
                    <input type="password" id="password" name="password" minlength="8" required>
                    <div class="icon"><img src="/login/icon/lock.png" alt=""></div>
                </div>
            </div>
            <div>
                <div style="width: 100%; display: flex; align-items:center; justify-content: center;">
                    <button style="padding-right: 0.5rem; padding-left: 0.5rem; margin: 2%; font-size: 0.8em;" class="button-54" type="submit" >entrar</button>
                    <button style="padding-right: 0.5rem; padding-left: 0.5rem; margin: 2%; font-size: 0.8em;"class="button-54" onclick="volver()">Volver</button>
                </div>
            </div>
        </form>
    </div>
    
    <!-- Aquí se mostrará el nombre del usuario logueado y el botón de logout -->
    <div id="user-info" style="display: none; width: 80%;">
        <h2>Bienvenido, <span id="display-username"></span>!</h2>
        <div style="width: 100%; display: flex; align-items:center; justify-content: center;">
            <button style="padding-left: 1rem; padding-right: 1rem; width: 15%; margin: 2%; font-size: 0.8em;" class="button-54" onclick="logout()">Cerrar Sesión</button>
            <button style="padding-left: 0.5rem; padding-right: 0.5rem; margin: 2%; font-size: 0.8em;"class="button-54" onclick="volver()">Volver</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
