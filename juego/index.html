<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bearlife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    img {
        height: 100%;
        width: 45%;
    }

    header {
        background-color: #252525;
        display: flex;
        justify-content: space-between; /* Distribuye el espacio */
        align-items: center; /* Alinea verticalmente */
        padding: 2%;
    }

    .logo {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    main {
        margin-top: 0.5%;
        display: flex;
        justify-content: center;
    }

    .button-54 {
        font-family: "Pixelify Sans", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-size: 1.45em;
        text-decoration: none;
        text-transform: uppercase;
        color: #000;
        cursor: pointer;
        border: 3px solid;
        box-shadow: 1px 1px 0px 0px, 2px 2px 0px 0px, 3px 3px 0px 0px, 4px 4px 0px 0px, 5px 5px 0px 0px;
        position: relative;
        height: 7vh;
        width: 8vw;
    }

    .button-54:active {
        box-shadow: 0px 0px 0px 0px;
        top: 5px;
        left: 5px;
    }

    .botones {
        display: flex;
        align-items: center;
        gap: 10px; /* Espacio entre botones */
    }
</style>
<body>
  <header>
    <div class="logo"><img src="../imagenes/bearlife2.png" alt=""></div>
    <div class="botones">
      <a href="../login/login.html"><button class="button-54" role="button">Login</button></a>
      <button class="button-54" role="button">Sign out</button>
    </div>
  </header>
  <main>
      <div id="juego"><script type="module" src="game.js"></script></div>
  </main>
</body>
</html>
